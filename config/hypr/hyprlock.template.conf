# Hyprlock template.
# Hyprlock does not load this file automatically. Copy or rename it to
# ~/.config/hypr/hyprlock.conf to use it.

# General lock screen options.
general {
    hide_cursor = true
    grace = 0
}

# Background. Without a monitor selector, it applies to all monitors.
background {
    path = ~/Pictures/Wallpapers/wallpaper-1.png
    blur_passes = 3
    blur_size = 8
}

# AccountsService profile photo. Replace USERNAME with your account name,
# or change the path to use a different image.
image {
    path = /var/lib/AccountsService/icons/USUARIO
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(454a52ff)

    position = 0, -25
    halign = center
    valign = center
}

# Clock.
label {
    text = $TIME
    color = rgba(e5e7ebff)
    font_size = 60
    font_family = JetBrainsMono Nerd Font

    position = 0, 170
    halign = center
    valign = center
}

# Date.
label {
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(9ca3afff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, 70
    halign = center
    valign = center
}

# Password field.
input-field {
    size = 280, 44
    outline_thickness = 1
    font_size = 14

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(454a52ff)
    inner_color = rgba(1b1e24ff)
    font_color = rgba(e5e7ebff)

    check_color = rgba(8994a3ff)
    fail_color = rgba(c66b70ff)

    fade_on_empty = false
    placeholder_text = Contraseña

    position = 0, -135
    halign = center
    valign = center
}
