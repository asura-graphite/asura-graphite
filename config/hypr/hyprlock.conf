general {
    hide_cursor = true
    grace = 0
}

background {
    monitor = DP-3
    path = ~/Pictures/Wallpapers/wallpaper-1.png
    blur_passes = 3
    blur_size = 8
}

# Clock
label {
    monitor = DP-3
    text = $TIME
    color = rgba(e5e7ebff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font

    position = 0, 125
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(9ca3afff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 45
    halign = center
    valign = center
}

# Password
input-field {
    monitor = DP-3
    size = 320, 52
    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(454a52ff)
    inner_color = rgba(1b1e24ff)
    font_color = rgba(e5e7ebff)

    check_color = rgba(8994a3ff)
    fail_color = rgba(c66b70ff)

    fade_on_empty = false
    placeholder_text = Password

    position = 0, -50
    halign = center
    valign = center
}
